<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Appmonto Studio">
  <title>Appmonto Studio</title>
  <defs>
    <linearGradient id="am-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#387CA1"/>
      <stop offset="1" stop-color="#174762"/>
    </linearGradient>
    <clipPath id="am-a">
      <!-- The letter A, doubling as the peak: two legs, a valley between them, and the crossbar. -->
      <path d="M32 7 L59 57 L45.5 57 L32 32 L18.5 57 L5 57 Z" />
      <rect x="23.2" y="41.5" width="17.6" height="5.7" />
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="14.4" fill="url(#am-sky)"/>

  <g clip-path="url(#am-a)">
    <rect width="64" height="64" fill="#96BAD1"/>
    <!-- Snowline: jagged, so the mark reads as rock below and snow above. -->
    <path d="M0 0 H64 V22 L56 24 L48 20 L40 25 L34 21 L26 26 L18 22 L8 27 L0 24 Z" fill="#FCFDFE"/>
  </g>
</svg>
